en:
  esalink:
    module:
      name: "EsaLink (accredited platform)"
    permissions:
      connection:
        manage: "Connect the EsaLink accredited platform"
    menu:
      esalink: "EsaLink"
    adapter: "EsaLink — Hubtimize (XP Z12-013 Flow API)"
    modes:
      sandbox: "Pre-production"
      production: "Production"
    deviations:
      token_password: "Token obtained with a username and password (POST /token as JSON), not with OAuth 2 client credentials: the adapter requests a new token when it expires."
