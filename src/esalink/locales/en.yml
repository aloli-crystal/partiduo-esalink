      search_without_cursor: "Flow search without nextCursor, with a total: the next page is read after the last flow read, by update date."
      no_refresh_token: "No token refresh route."
      production_url: "Production address not published: to be entered when EsaLink provides it."
    errors:
      connection:
        production_url: "Enter the production address provided by EsaLink."
        failed: "EsaLink does not respond as expected: %{detail}"
        missing: "EsaLink is not the connected platform."
      transport:
        no_production_url: "EsaLink production address not filled in"
