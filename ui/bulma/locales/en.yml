en:
  esalink_ui:
    title: "EsaLink accredited platform"
    note: "The password, API key and tokens are encrypted in the database and never displayed again. Once connected, EsaLink becomes the accredited platform for e-invoicing: transmissions, receptions and statuses are followed in the e-invoicing screens."
    status:
      title: "Connection status"
      connected: "EsaLink is connected."
