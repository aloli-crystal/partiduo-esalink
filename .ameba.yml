# Configuration d'Ameba pour partiduo-esalink.
Globs:
  - "**/*.cr"
  - "!lib"

Excluded:
  - lib/

# Objets exposés aux gabarits Marten : un attribut booléen doit s'appeler sans
# `?` pour être lu dans un gabarit (D-UI-016 de l'interface).
Naming/QueryBoolMethods:
  Excluded:
    - ui/bulma/presenters.cr

# EsaLink simulée (un branchement par écart reproduit) et état du
# raccordement (un champ facultatif par paramètre) : même réglage qu'EINV
# et SUPERPDP (DECISIONS D-EINV-013).
Metrics/CyclomaticComplexity:
  MaxComplexity: 20
